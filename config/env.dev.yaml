slack:
  enabled: true
  allowed_user_ids: []
  # Channel where bot posts proactive "my tickets" updates (your private bot channel)
  bucket_channel_id: "C0AHL6C343V"
  # Channel to LISTEN for DevRev ticket notifications (e.g. #engage-production-issues)
  # Bot watches here, filters by your parts, replies in-thread for matching tickets only
  watch_channel_id: "C084W9R9T3J"

anthropic:
  model: claude-sonnet-4-20250514
  max_tokens: 8192
  max_turns: 20



devrev:
  solved_states: "closed,done,resolved"
  closed_stage_name: "Closed"
  # Optional: for webhook (manideep-bot-webhook). Set DEVREV_WEBHOOK_SECRET or webhook_secret after creating webhook in DevRev.
  # webhook_secret: ""
  # app_base_url: "https://app.devrev.ai"   # base URL for "Related past tickets" links in Slack

retriever:
  top_k: 12
  use_bm25: true
  # Optional: semantic search (needs OPENAI_API_KEY). Reduces misleading top-k when no good match.
  use_embeddings: false
  embedding_provider: openai
  min_similarity: 0.0     


bucket:
  max_tickets_per_run: 10
  states: ["open", "in_progress", "triaged", "backlog"]


monitor:
  enabled: true
  interval_minutes: 20
  solved_fetch_interval_hours: 24
  new_ticket_filters:
    applies_to_part_names:
      - "distribution channel and reseller"
      - "issuance"
      - "wallet as service"
    applies_to_part: []  
    state: ["open", "triaged", "backlog"]
    stage_names: ["triage"]  
    unassigned_only: true    
  my_tickets:
    enabled: true
    # DevRev work states (API states, not UI stages)
    states_to_watch: ["open", "in_progress", "triaged"]
    # Your actual workflow STAGES (as shown in DevRev UI):
    # "To Do", "Under Investigation", "Awaiting Info", "Escalated to Dev", "Review", "Testing", "Triage"
    # Bot monitors ALL your assigned tickets in above states, regardless of stage
    # Special handling for these stages (e.g., show stage name in alerts):
    awaiting_info_stage_names: ["Awaiting Info", "Awaiting info from reporter", "Awaiting Customer"]
    escalated_stage_names: ["Escalated to Dev", "Escalated to dev"]
