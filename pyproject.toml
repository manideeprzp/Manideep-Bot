[project]
name = "manideep-bot"
version = "0.1.0"
description = "Manideep Bot: Slack agent that works like you (DevRev tickets + past solved tickets + skills)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "PyYAML>=6.0",
    "slack-bolt>=1.27.0",
    "slack-sdk>=3.39.0",
]

[project.scripts]
manideep-bot = "manideep_bot.app:run"
manideep-bot-monitor = "manideep_bot.monitor_cli:main"
manideep-bot-bucket = "manideep_bot.bucket_cli:main"
manideep-bot-webhook = "manideep_bot.webhook_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
